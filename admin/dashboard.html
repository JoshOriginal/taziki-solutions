<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Taziki Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .sidebar {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }
    
    .btn-primary {
      @apply bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-lg transition-colors;
    }
    
    .btn-secondary {
      @apply bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition-colors;
    }
    
    .input-field {
      @apply w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-orange-500;
    }
    
    .editor-toolbar {
      @apply flex gap-2 mb-4 flex-wrap;
    }
    
    .editor-btn {
      @apply bg-gray-700 hover:bg-gray-600 text-white font-medium py-1 px-3 rounded transition-colors text-sm;
    }
    
    .success-alert {
      @apply bg-green-900/30 border border-green-700 text-green-300 px-4 py-3 rounded-lg mb-4;
    }
    
    .error-alert {
      @apply bg-red-900/30 border border-red-700 text-red-300 px-4 py-3 rounded-lg mb-4;
    }

    /* Improved Admin Styles */
    .admin-container {
      background: #0f172a;
      min-height: 100vh;
    }

    .admin-input {
      @apply w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent;
    }

    .admin-textarea {
      @apply w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-vertical min-h-[120px];
    }

    .admin-select {
      @apply w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent;
    }

    /* HUGE CONTENT EDITOR - Almost full screen */
    .admin-editor {
      @apply w-full px-6 py-6 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-vertical min-h-[80vh] font-sans text-lg leading-relaxed;
    }

    .admin-label {
      @apply block text-sm font-medium text-gray-200 mb-2;
    }

    .admin-card {
      @apply bg-gray-900 border border-gray-700 rounded-xl p-6 shadow-lg;
    }

    /* Improved Editor Toolbar */
    .editor-toolbar {
      @apply flex gap-2 mb-4 p-4 bg-gray-800 rounded-lg border border-gray-700 flex-wrap;
    }

    .editor-btn {
      @apply bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded transition-colors text-sm border border-gray-600;
    }

    .editor-btn:hover {
      @apply bg-orange-500 border-orange-500;
    }

    /* Better placeholder visibility */
    ::placeholder {
      color: #9CA3AF !important;
      opacity: 1 !important;
    }

    :-ms-input-placeholder {
      color: #9CA3AF !important;
    }

    ::-ms-input-placeholder {
      color: #9CA3AF !important;
    }

    /* Focus states */
    input:focus, textarea:focus, select:focus {
      background-color: #1F2937 !important;
      border-color: #F97316 !important;
    }

    /* Improved file upload area */
    .file-upload-area {
      @apply border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-orange-500 transition-colors;
    }

    .file-upload-area.dragover {
      @apply border-orange-500 bg-orange-500/10;
    }

    /* Better button styles */
    .btn-publish {
      @apply bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-6 rounded-lg transition-colors;
    }

    .btn-draft {
      @apply bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors;
    }

    .btn-cancel {
      @apply bg-gray-600 hover:bg-gray-700 text-white font-medium py-3 px-6 rounded-lg transition-colors;
    }

    /* Status badges */
    .status-badge {
      @apply px-3 py-1 rounded-full text-xs font-medium;
    }

    .status-published {
      @apply bg-green-900 text-green-300;
    }

    .status-draft {
      @apply bg-blue-900 text-blue-300;
    }

    /* Full height layout for create view */
    .create-view-container {
      height: calc(100vh - 2rem);
      margin: 1rem;
    }

    .editor-main-column {
      height: calc(100vh - 8rem);
    }

    .editor-content-area {
      height: calc(100vh - 12rem);
    }
  </style>
</head>
<body>
  <div x-data="adminApp()" x-init="init()" class="flex h-screen">
    
    <!-- Sidebar -->
    <aside class="w-64 sidebar border-r border-gray-700">
      <div class="p-6 border-b border-gray-700">
        <h1 class="text-2xl font-bold">
          <span class="text-orange-500">Taziki</span><span class="text-white">Admin</span>
        </h1>
      </div>
      
      <nav class="p-6 space-y-4">
        <button @click="currentView = 'dashboard'" :class="currentView === 'dashboard' ? 'bg-orange-500 text-white' : 'text-gray-300 hover:text-white'" class="w-full text-left px-4 py-3 rounded-lg transition-colors flex items-center gap-3">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </button>
        
        <button @click="currentView = 'blogs'" :class="currentView === 'blogs' ? 'bg-orange-500 text-white' : 'text-gray-300 hover:text-white'" class="w-full text-left px-4 py-3 rounded-lg transition-colors flex items-center gap-3">
          <i class="fas fa-blog"></i>
          <span>Blog Posts</span>
        </button>
        
        <button @click="currentView = 'create'" :class="currentView === 'create' ? 'bg-orange-500 text-white' : 'text-gray-300 hover:text-white'" class="w-full text-left px-4 py-3 rounded-lg transition-colors flex items-center gap-3">
          <i class="fas fa-plus"></i>
          <span>Create Blog</span>
        </button>
      </nav>
      
      <div class="absolute bottom-6 left-6 right-6">
        <button @click="logout()" class="w-full btn-secondary flex items-center justify-center gap-2">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
      <!-- Login View -->
      <div x-show="currentView === 'login'" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
          <div class="bg-gray-900 border border-gray-800 rounded-lg p-8">
            <h2 class="text-3xl font-bold text-center mb-8">Admin Login</h2>
            
            <div x-show="loginError" class="error-alert" x-text="loginError"></div>
            
            <form @submit.prevent="handleLogin()">
              <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Username</label>
                <input x-model="loginForm.username" type="text" class="admin-input" placeholder="Enter username" required>
              </div>
              
              <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Password</label>
                <input x-model="loginForm.password" type="password" class="admin-input" placeholder="Enter password" required>
              </div>
              
              <button type="submit" class="btn-primary w-full" :disabled="loading">
                <span x-show="!loading">Login</span>
                <span x-show="loading"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
              </button>
            </form>
          </div>
        </div>
      </div>
      
      <!-- Dashboard View -->
      <div x-show="currentView === 'dashboard'" class="p-8">
        <h2 class="text-3xl font-bold mb-8">Dashboard</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm">Total Blogs</p>
                <p class="text-3xl font-bold" x-text="stats.totalBlogs"></p>
              </div>
              <i class="fas fa-blog text-orange-500 text-4xl opacity-20"></i>
            </div>
          </div>
          
          <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm">Published</p>
                <p class="text-3xl font-bold" x-text="stats.publishedBlogs"></p>
              </div>
              <i class="fas fa-check-circle text-green-500 text-4xl opacity-20"></i>
            </div>
          </div>
          
          <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-400 text-sm">Drafts</p>
                <p class="text-3xl font-bold" x-text="stats.draftBlogs"></p>
              </div>
              <i class="fas fa-file-alt text-blue-500 text-4xl opacity-20"></i>
            </div>
          </div>
        </div>
        
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
          <h3 class="text-xl font-bold mb-4">Recent Blog Posts</h3>
          <div class="space-y-2">
            <template x-for="blog in blogs.slice(0, 5)" :key="blog.id">
              <div class="flex items-center justify-between p-4 bg-gray-800 rounded-lg">
                <div>
                  <p class="font-medium" x-text="blog.title"></p>
                  <p class="text-sm text-gray-400" x-text="blog.status"></p>
                </div>
                <span class="text-xs bg-gray-700 px-3 py-1 rounded" x-text="blog.category"></span>
              </div>
            </template>
          </div>
        </div>
      </div>
      
      <!-- Blogs View -->
      <div x-show="currentView === 'blogs'" class="p-8">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-3xl font-bold">Blog Posts</h2>
          <button @click="currentView = 'create'" class="btn-primary flex items-center gap-2">
            <i class="fas fa-plus"></i>
            <span>New Blog</span>
          </button>
        </div>
        
        <div x-show="successMessage" class="success-alert" x-text="successMessage"></div>
        <div x-show="errorMessage" class="error-alert" x-text="errorMessage"></div>
        
        <!-- Filter tabs -->
        <div class="flex gap-4 mb-6">
          <button @click="filterStatus = 'all'" :class="filterStatus === 'all' ? 'btn-primary' : 'btn-secondary'" class="flex items-center gap-2">
            <span>All</span>
            <span class="text-sm" x-text="'(' + blogs.length + ')'"></span>
          </button>
          <button @click="filterStatus = 'published'" :class="filterStatus === 'published' ? 'btn-primary' : 'btn-secondary'" class="flex items-center gap-2">
            <span>Published</span>
            <span class="text-sm" x-text="'(' + blogs.filter(b => b.status === 'published').length + ')'"></span>
          </button>
          <button @click="filterStatus = 'draft'" :class="filterStatus === 'draft' ? 'btn-primary' : 'btn-secondary'" class="flex items-center gap-2">
            <span>Drafts</span>
            <span class="text-sm" x-text="'(' + blogs.filter(b => b.status === 'draft').length + ')'"></span>
          </button>
        </div>
        
        <!-- Blogs Table -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-800 border-b border-gray-700">
              <tr>
                <th class="text-left px-6 py-4">Title</th>
                <th class="text-left px-6 py-4">Category</th>
                <th class="text-left px-6 py-4">Status</th>
                <th class="text-left px-6 py-4">Date</th>
                <th class="text-center px-6 py-4">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="blog in getFilteredBlogs()" :key="blog.id">
                <tr class="border-b border-gray-700 hover:bg-gray-800/50 transition-colors">
                  <td class="px-6 py-4 font-medium" x-text="blog.title"></td>
                  <td class="px-6 py-4 text-gray-400" x-text="blog.category"></td>
                  <td class="px-6 py-4">
                    <span :class="blog.status === 'published' ? 'bg-green-900 text-green-300' : 'bg-blue-900 text-blue-300'" class="px-3 py-1 rounded-full text-xs font-medium" x-text="blog.status"></span>
                  </td>
                  <td class="px-6 py-4 text-gray-400 text-sm" x-text="new Date(blog.dateCreated).toLocaleDateString()"></td>
                  <td class="px-6 py-4 flex justify-center gap-2">
                    <button @click="editBlog(blog)" class="text-blue-400 hover:text-blue-300">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button @click="deleteBlog(blog.id)" class="text-red-400 hover:text-red-300" onclick="return confirm('Are you sure?')">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
      
<!-- Create/Edit Blog View - UPDATED -->
<div x-show="currentView === 'create'" class="create-view-container">
  <div class="h-full flex flex-col">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-3xl font-bold text-white" x-text="editingBlog ? 'Edit Blog Post' : 'Create New Blog Post'"></h2>
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-400" x-text="blogForm.content.length + ' characters'"></span>
        <span class="text-sm text-gray-400" x-text="blogForm.content.split(' ').length + ' words'"></span>
        <span class="text-sm text-gray-400" x-text="Math.ceil(blogForm.content.split(' ').length / 200) + ' min read'"></span>
      </div>
    </div>
    
    <div x-show="successMessage" class="success-alert mb-4" x-text="successMessage"></div>
    <div x-show="errorMessage" class="error-alert mb-4" x-text="errorMessage"></div>
    
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6 h-full">
      <!-- Main Content Column - Takes most space -->
      <div class="lg:col-span-3 flex flex-col h-full">
        <!-- Title -->
        <div class="admin-card mb-6">
          <label class="admin-label">Title *</label>
          <input 
            x-model="blogForm.title" 
            type="text" 
            class="admin-input text-xl" 
            placeholder="Write a compelling title that captures attention..."
            required
          >
        </div>
        
        <!-- Content Editor - HUGE AREA -->
        <div class="admin-card flex-1 flex flex-col">
          <label class="admin-label">Content *</label>
          
          <!-- Enhanced Editor Toolbar -->
          <div class="editor-toolbar">
            <div class="flex gap-2 flex-wrap">
              <button type="button" @click="insertTag('<h1>', '</h1>')" class="editor-btn" title="Heading 1">
                <i class="fas fa-heading"></i> H1
              </button>
              <button type="button" @click="insertTag('<h2>', '</h2>')" class="editor-btn" title="Heading 2">
                H2
              </button>
              <button type="button" @click="insertTag('<h3>', '</h3>')" class="editor-btn" title="Heading 3">
                H3
              </button>
              <button type="button" @click="insertTag('<p>', '</p>')" class="editor-btn" title="Paragraph">
                <i class="fas fa-paragraph"></i>
              </button>
              <button type="button" @click="insertTag('<strong>', '</strong>')" class="editor-btn" title="Bold">
                <i class="fas fa-bold"></i>
              </button>
              <button type="button" @click="insertTag('<em>', '</em>')" class="editor-btn" title="Italic">
                <i class="fas fa-italic"></i>
              </button>
              <button type="button" @click="insertTag('<ul>\\n<li>', '</li>\\n</ul>')" class="editor-btn" title="List">
                <i class="fas fa-list"></i>
              </button>
              <button type="button" @click="insertTag('<blockquote>', '</blockquote>')" class="editor-btn" title="Quote">
                <i class="fas fa-quote-left"></i>
              </button>
              <button type="button" @click="insertTag('<code>', '</code>')" class="editor-btn" title="Code">
                <i class="fas fa-code"></i>
              </button>
              <button type="button" @click="insertTag('<a href=\"#\">', '</a>')" class="editor-btn" title="Link">
                <i class="fas fa-link"></i>
              </button>
            </div>
          </div>
          
          <!-- HUGE TEXTAREA -->
          <textarea 
            x-model="blogForm.content" 
            class="admin-editor flex-1" 
            placeholder="Start writing your blog post here... You can use HTML tags or Markdown-style formatting. Write as if you're having a conversation with your readers."
            required
          ></textarea>
        </div>
      </div>
      
      <!-- Sidebar Settings - Compact -->
      <div class="lg:col-span-1 space-y-6 overflow-y-auto max-h-[calc(100vh-8rem)]">
        <!-- Publish Card -->
        <div class="admin-card">
          <h3 class="text-lg font-semibold text-white mb-4">Publish</h3>
          <div class="space-y-4">
            <div>
              <label class="admin-label">Status</label>
              <select x-model="blogForm.status" class="admin-select">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </div>
            <div class="flex gap-2 pt-2">
              <button 
                @click="blogForm.status = 'published'; saveBlog()" 
                class="btn-publish flex-1 flex items-center justify-center gap-2 text-sm"
                :disabled="loading"
              >
                <span x-show="!loading">
                  <i class="fas fa-rocket"></i>
                  <span x-text="editingBlog ? 'Update' : 'Publish'"></span>
                </span>
                <span x-show="loading"><i class="fas fa-spinner fa-spin"></i></span>
              </button>
              <button 
                @click="blogForm.status = 'draft'; saveBlog()" 
                class="btn-draft flex items-center justify-center gap-2 px-3 text-sm"
                :disabled="loading"
              >
                <span x-show="!loading">
                  <i class="fas fa-save"></i>
                </span>
                <span x-show="loading"><i class="fas fa-spinner fa-spin"></i></span>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Featured Image Card -->
        <div class="admin-card">
          <h3 class="text-lg font-semibold text-white mb-4">Featured Image</h3>
          <div class="space-y-4">
            <div x-show="blogForm.image" class="text-center">
              <img :src="blogForm.image" :alt="blogForm.title" class="w-full h-24 object-cover rounded-lg mb-2">
              <button @click="blogForm.image = ''" type="button" class="text-red-400 hover:text-red-300 text-xs">
                <i class="fas fa-trash"></i> Remove
              </button>
            </div>
            <div class="file-upload-area" 
                 @drop="handleFileDrop($event)"
                 @dragover.prevent
                 @dragenter.prevent>
              <input id="imageFile" type="file" accept="image/*" class="hidden" @change="fileChanged($event)">
              <i class="fas fa-cloud-upload-alt text-xl text-gray-400 mb-2"></i>
              <p class="text-xs text-gray-400 mb-2">Drag & drop or</p>
              <button type="button" @click="document.getElementById('imageFile').click()" class="btn-secondary text-xs">
                Choose File
              </button>
            </div>
            <div>
              <label class="admin-label text-xs">Image URL</label>
              <input 
                x-model="blogForm.image" 
                type="url" 
                class="admin-input text-sm py-2" 
                placeholder="https://example.com/image.jpg"
              >
            </div>
            <button 
              type="button" 
              @click="uploadImage()" 
              class="btn-primary w-full text-sm py-2" 
              :disabled="uploading || !_selectedFile"
            >
              <span x-show="!uploading">Upload Image</span>
              <span x-show="uploading"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
          </div>
        </div>
        
        <!-- Settings Card -->
        <div class="admin-card">
          <h3 class="text-lg font-semibold text-white mb-4">Settings</h3>
          <div class="space-y-4">
            <div>
              <label class="admin-label">Category</label>
              <select x-model="blogForm.category" class="admin-select text-sm py-2">
                <option value="Technology Trends">Technology Trends</option>
                <option value="Web Development">Web Development</option>
                <option value="App Development">App Development</option>
                <option value="Business Growth">Business Growth</option>
                <option value="Network Security">Network Security</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="General">General</option>
              </select>
            </div>
            <div>
              <label class="admin-label">Author</label>
              <input 
                x-model="blogForm.author" 
                type="text" 
                class="admin-input text-sm py-2" 
                placeholder="Taziki Solutions"
              >
            </div>
            <div>
              <label class="admin-label">Excerpt</label>
              <textarea 
                x-model="blogForm.excerpt" 
                class="admin-textarea text-sm" 
                rows="2"
                placeholder="Brief summary..."
              ></textarea>
            </div>
            <div class="flex items-center gap-3 p-3 bg-gray-800 rounded-lg">
              <input x-model="blogForm.featured" type="checkbox" class="w-4 h-4 text-orange-500 bg-gray-700 border-gray-600 rounded focus:ring-orange-500">
              <div>
                <label class="text-sm font-medium text-white">Featured</label>
                <p class="text-xs text-gray-400">Show in featured section</p>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Actions Card -->
        <div class="admin-card">
          <h3 class="text-lg font-semibold text-white mb-4">Actions</h3>
          <div class="space-y-2">
            <button type="button" @click="resetForm()" class="btn-secondary w-full text-sm py-2">
              <i class="fas fa-redo mr-2"></i> Reset
            </button>
            <button type="button" @click="currentView = 'blogs'; resetForm();" class="btn-cancel w-full text-sm py-2">
              <i class="fas fa-times mr-2"></i> Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  <script>
    function adminApp() {
      return {
        currentView: 'login',
        loading: false,
        uploading: false,
        _selectedFile: null,
        adminToken: localStorage.getItem('adminToken') || null,
        
        // API Base URL - Updated for Railway
        API_BASE: 'https://taziki-solutions-production.up.railway.app',
        
        // Login
        loginForm: { username: '', password: '' },
        loginError: '',
        
        // Blogs
        blogs: [],
        blogForm: {
          title: '',
          category: 'General',
          excerpt: '',
          content: '',
          featured: false,
          image: '/images/blog-default.jpg',
          author: 'Taziki Solutions',
          status: 'draft'
        },
        editingBlog: null,
        filterStatus: 'all',
        successMessage: '',
        errorMessage: '',
        stats: {
          totalBlogs: 0,
          publishedBlogs: 0,
          draftBlogs: 0
        },
        
        async init() {
          if (this.adminToken) {
            this.currentView = 'dashboard';
            await this.loadBlogs();
            this.updateStats();
          } else {
            this.currentView = 'login';
          }
        },
        
        async handleLogin() {
          this.loading = true;
          this.loginError = '';
          
          try {
            const response = await fetch(`${this.API_BASE}/admin/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.loginForm)
            });
            
            const data = await response.json();
            
            if (data.success) {
              this.adminToken = data.token;
              localStorage.setItem('adminToken', data.token);
              this.currentView = 'dashboard';
              this.loginForm = { username: '', password: '' };
              await this.loadBlogs();
              this.updateStats();
            } else {
              this.loginError = data.message || 'Login failed';
            }
          } catch (error) {
            this.loginError = 'Connection error: ' + error.message;
          } finally {
            this.loading = false;
          }
        },
        
        logout() {
          if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('adminToken');
            this.adminToken = null;
            this.currentView = 'login';
            this.blogs = [];
          }
        },
        
        async loadBlogs() {
          try {
            const response = await fetch(`${this.API_BASE}/admin/blogs`, {
              headers: { 'Authorization': `Bearer ${this.adminToken}` }
            });
            
            const data = await response.json();
            if (data.success) {
              this.blogs = data.blogs;
            } else {
              this.errorMessage = data.message;
            }
          } catch (error) {
            this.errorMessage = 'Failed to load blogs: ' + error.message;
          }
        },
        
        updateStats() {
          this.stats.totalBlogs = this.blogs.length;
          this.stats.publishedBlogs = this.blogs.filter(b => b.status === 'published').length;
          this.stats.draftBlogs = this.blogs.filter(b => b.status === 'draft').length;
        },
        
        getFilteredBlogs() {
          if (this.filterStatus === 'all') {
            return this.blogs;
          }
          return this.blogs.filter(b => b.status === this.filterStatus);
        },
        
        async saveBlog() {
          if (!this.blogForm.title || !this.blogForm.content) {
            this.errorMessage = 'Title and content are required';
            return;
          }
          
          this.loading = true;
          this.successMessage = '';
          this.errorMessage = '';
          
          try {
            const method = this.editingBlog ? 'PUT' : 'POST';
            const url = this.editingBlog ? `${this.API_BASE}/admin/blogs/${this.editingBlog.id}` : `${this.API_BASE}/admin/blogs`;
            
            const response = await fetch(url, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.adminToken}`
              },
              body: JSON.stringify(this.blogForm)
            });
            
            const data = await response.json();
            
            if (data.success) {
              this.successMessage = data.message;
              await this.loadBlogs();
              this.updateStats();
              
              setTimeout(() => {
                this.resetForm();
                this.currentView = 'blogs';
              }, 1500);
            } else {
              this.errorMessage = data.message || 'Failed to save blog';
            }
          } catch (error) {
            this.errorMessage = 'Error: ' + error.message;
          } finally {
            this.loading = false;
          }
        },
        
        // File upload helpers
        fileChanged(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          this._selectedFile = file;
        },

        async uploadImage() {
          if (!this._selectedFile) {
            this.errorMessage = 'No file selected for upload';
            return;
          }
          this.uploading = true;
          this.errorMessage = '';
          try {
            const form = new FormData();
            form.append('image', this._selectedFile);
            const resp = await fetch(`${this.API_BASE}/admin/upload-image`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${this.adminToken}` },
              body: form
            });
            const data = await resp.json();
            if (data.success && data.url) {
              this.blogForm.image = data.url;
              this.successMessage = 'Image uploaded successfully';
            } else {
              this.errorMessage = data.message || 'Upload failed';
            }
          } catch (err) {
            this.errorMessage = 'Upload error: ' + err.message;
          } finally {
            this.uploading = false;
            this._selectedFile = null;
            document.getElementById('imageFile').value = '';
          }
        },
        
        // Drag and drop handler
        handleFileDrop(e) {
          e.preventDefault();
          const files = e.dataTransfer.files;
          if (files.length > 0 && files[0].type.startsWith('image/')) {
            this._selectedFile = files[0];
            // Optional: Auto-upload on drop
            // this.uploadImage();
          }
        },
        
        editBlog(blog) {
          this.editingBlog = blog;
          this.blogForm = { ...blog };
          this.currentView = 'create';
          document.querySelector('html').scrollTop = 0;
        },
        
        async deleteBlog(id) {
          this.loading = true;
          try {
            const response = await fetch(`${this.API_BASE}/admin/blogs/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${this.adminToken}` }
            });
            
            const data = await response.json();
            
            if (data.success) {
              this.successMessage = data.message;
              await this.loadBlogs();
              this.updateStats();
            } else {
              this.errorMessage = data.message || 'Failed to delete blog';
            }
          } catch (error) {
            this.errorMessage = 'Error: ' + error.message;
          } finally {
            this.loading = false;
          }
        },
        
        resetForm() {
          this.blogForm = {
            title: '',
            category: 'General',
            excerpt: '',
            content: '',
            featured: false,
            image: '/images/blog-default.jpg',
            author: 'Taziki Solutions',
            status: 'draft'
          };
          this.editingBlog = null;
          this.successMessage = '';
          this.errorMessage = '';
        },
        
        insertTag(openTag, closeTag) {
          const textarea = document.querySelector('textarea[placeholder*="Start writing"]');
          if (!textarea) return;
          
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const selected = this.blogForm.content.substring(start, end);
          const text = this.blogForm.content;
          
          this.blogForm.content = text.substring(0, start) + openTag + selected + closeTag + text.substring(end);
          
          setTimeout(() => {
            textarea.focus();
            textarea.selectionStart = start + openTag.length;
          }, 0);
        }
      };
    }
  </script>
</body>
</html>
